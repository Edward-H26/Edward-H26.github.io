<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname;
    if (path !== "/" && path !== "/index.html") {
      sessionStorage.setItem("redirect", path);
      window.location.replace("/");
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
